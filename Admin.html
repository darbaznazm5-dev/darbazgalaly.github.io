<!doctype html>
<html lang="ku" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechZone Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f4f6;color:#172033}.bar{background:#111827;color:white;padding:18px 5%;display:flex;justify-content:space-between}.container{padding:30px 5%;max-width:1200px;margin:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.stat,.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:20px}.stat b{display:block;font-size:28px;color:#2563eb;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.msg{padding:12px;border-radius:10px;background:#eff6ff;margin-bottom:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><header class="bar"><b>TechZone Admin</b><a href="index.html">گەڕانەوە بۆ ماڵپەڕ</a></header>
<main class="container"><div id="notice" class="msg">چاوەڕێی Supabase...</div>
<section class="stats"><div class="stat">کۆی بەرهەمەکان<b id="pc">0</b></div><div class="stat">کۆی داواکارییەکان<b id="oc">0</b></div></section>
<section class="panel"><h2>زیادکردنی بەرهەم</h2><form id="form"><div class="grid">
<div><label>ناو</label><input id="name" required></div><div><label>Brand</label><input id="brand"></div>
<div><label>نرخ IQD</label><input id="price" type="number" min="0" required></div><div><label>Stock</label><input id="stock" type="number" min="0" value="0"></div>
<div><label>SKU</label><input id="sku"></div><div><label>Category ID</label><input id="category_id"></div></div>
<label>Image URL</label><input id="image_url"><label>Description</label><textarea id="description"></textarea>
<button class="btn primary">زیادکردن</button></form></section>
<section class="panel"><h2>بەرهەمەکان</h2><div class="tablewrap"><table><thead><tr><th>ناو</th><th>Brand</th><th>نرخ</th><th>Stock</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><h2>داواکارییەکان</h2><div class="tablewrap"><table><thead><tr><th>Order</th><th>کڕیار</th><th>کۆی گشتی</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="YOUR_SUPABASE_URL",SUPABASE_KEY="YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),money=n=>Number(n||0).toLocaleString("en-US")+" IQD";
async function load(){let[p,o]=await Promise.all([supabase.from("products").select("*").order("created_at",{ascending:false}),supabase.from("orders").select("*").order("created_at",{ascending:false})]);if(p.error||o.error){document.getElementById("notice").textContent="کێشە لە Supabase. URL/Key و Admin role بپشکنە.";return}let ps=p.data||[],os=o.data||[];document.getElementById("pc").textContent=ps.length;document.getElementById("oc").textContent=os.length;document.getElementById("notice").textContent="پەیوەندی بە Supabase سەرکەوتووە ✅";document.getElementById("rows").innerHTML=ps.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.brand)}</td><td>${money(x.price)}</td><td>${x.stock}</td><td><button class="btn danger" onclick="removeProduct('${x.id}')">سڕینەوە</button></td></tr>`).join("");document.getElementById("orders").innerHTML=os.map(x=>`<tr><td>${esc(x.order_number)}</td><td>${esc(x.customer_name)}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td></tr>`).join("")}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();let name=document.getElementById("name").value.trim(),row={name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now(),brand:document.getElementById("brand").value.trim()||null,price:Number(document.getElementById("price").value),stock:Number(document.getElementById("stock").value||0),sku:document.getElementById("sku").value.trim()||null,category_id:document.getElementById("category_id").value.trim()||null,image_url:document.getElementById("image_url").value.trim()||null,description:document.getElementById("description").value.trim()||null,is_active:true};let{error}=await supabase.from("products").insert(row);if(error)alert(error.message);else{e.target.reset();load();alert("بەرهەمەکە زیادکرا ✅")}});
window.removeProduct=async id=>{if(!confirm("دڵنیایت؟"))return;let{error}=await supabase.from("products").delete().eq("id",id);if(error)alert(error.message);else load()};load();
</script></body></html>
