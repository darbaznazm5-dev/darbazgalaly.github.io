<!doctype html>
<html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechZone | Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="toast"></div><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="logo">TZ</span><span>Tech<span>Zone</span><small>Admin Dashboard</small></span></a><button class="btn ghost" onclick="adminLogout()">چوونەدەرەوە</button></div></header>
<main class="container section"><div class="admin-head"><div><span class="eyebrow">Control Center</span><h1>داشبۆردی بەڕێوەبەرایەتی</h1></div><span id="adminUser" class="badge">پشکنین...</span></div>
<div class="stats"><div><b id="statProducts">0</b><span>بەرهەم</span></div><div><b id="statOrders">0</b><span>داواکاری</span></div><div><b id="statStock">0</b><span>کۆی دانە</span></div><div><b id="statSales">0</b><span>فرۆشتن</span></div></div>
<div class="admin-grid"><section class="panel"><h2>زیادکردنی بەرهەم</h2><form id="productForm"><input name="name" placeholder="ناوی بەرهەم" required><input name="brand" placeholder="براند"><input name="price" type="number" placeholder="نرخ بە IQD" required><input name="stock" type="number" placeholder="کۆگا" value="10"><input name="image_url" placeholder="لینکی وێنە"><textarea name="description" placeholder="وەسف"></textarea><button class="btn primary wide">زیادکردن</button></form></section><section class="panel"><div class="section-head"><h2>بەرهەمەکان</h2><button class="btn ghost" onclick="loadAdmin()">نوێکردنەوە</button></div><div id="adminProducts" class="table-wrap"></div></section></div>
<section class="panel"><h2>داواکارییەکان</h2><div id="adminOrders" class="table-wrap"></div></section>
</main><script type="module" src="app.js"></script></body></html>
