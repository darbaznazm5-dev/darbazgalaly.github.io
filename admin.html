<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Pasta Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#eee;font-family:Montserrat}
.wrap{width:min(1100px,94%);margin:auto}
.top{padding:35px 0;display:flex;justify-content:space-between;align-items:center}
.k{color:#d9a85b;font-size:10px;letter-spacing:.3em}
.title{font:600 55px "Cormorant Garamond";color:#efc477;margin:5px 0}
.btn{border:1px solid #d9a85b;background:#4d101c;color:#ffe8bd;padding:11px 18px;cursor:pointer}
.login,.panel{background:#151515;border:1px solid #34261f;padding:25px}
.login{max-width:430px;margin:70px auto}
.login h2,.panel h2{font:500 42px "Cormorant Garamond";color:#efc477;margin:4px 0 20px}
label{font-size:10px;color:#bbb;display:block;margin:12px 0 5px}
input{width:100%;padding:12px;background:#0e0e0e;border:1px solid #654737;color:#fff}
.login .btn{width:100%;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{background:#151515;border:1px solid #34261f;padding:18px}
.stat b{display:block;font:600 34px "Cormorant Garamond";color:#efc477}
.stat span{font-size:10px;color:#999}
.table{overflow:auto}
.panel table{width:100%;border-collapse:collapse;min-width:780px}
.panel th,.panel td{padding:12px;border-bottom:1px solid #2a2521;text-align:left;font-size:10px}
.panel th{color:#d9a85b}
.danger{background:#351019;color:#efb6bf;border:1px solid #713040;padding:7px;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.message{font-size:11px;min-height:18px;margin-top:12px}
.ok{color:#9bd39b}.bad{color:#d88}.muted{color:#777}
@media(max-width:650px){
  .stats{grid-template-columns:1fr}
  .top{align-items:flex-start;gap:10px;flex-direction:column}
  .title{font-size:48px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <div class="k">LA PASTA · PRIVATE ADMIN</div>
    <div class="title">Reservations</div>
  </div>
  <div class="actions">
    <a class="btn" href="index.html">← Website</a>
    <button id="logoutBtn" class="btn" style="display:none" onclick="logout()">Sign Out</button>
  </div>
</div>

<div id="login" class="login">
  <div class="k">SECURE LOGIN</div>
  <h2>Admin Access</h2>

  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Admin email">

  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">

  <button id="signBtn" class="btn" onclick="login()">Sign In</button>
  <button id="testBtn" class="btn" style="background:#151515;margin-top:8px" onclick="testApi()">Test Connection</button>

  <p id="err" class="message"></p>
</div>

<div id="app" style="display:none">
  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Total Reservations</span></div>
    <div class="stat"><b id="today">0</b><span>Today</span></div>
    <div class="stat"><b id="g">0</b><span>Total Guests</span></div>
  </div>

  <div class="panel">
    <h2>Booking List</h2>
    <div class="table">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>Date</th><th>Time</th>
            <th>Guests</th><th>Created</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted">No reservations.</p>
    <p id="appMsg" class="message"></p>
  </div>
</div>

</div>

<script>
const SUPABASE_URL = "https://rtnfoklcgupugdyumwpp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KjtCQyZ7VKPc0f3g7fq6HQ_DPxGHM9A";

let accessToken = sessionStorage.getItem("laPastaAccessToken") || "";

function apiHeaders(auth=true){
  const h = {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
  if(auth && accessToken) h["Authorization"] = "Bearer " + accessToken;
  return h;
}

function setMessage(text, ok=false){
  const el = document.getElementById("err");
  el.textContent = text || "";
  el.className = "message " + (ok ? "ok" : "bad");
}

function setAppMessage(text, ok=false){
  const el = document.getElementById("appMsg");
  el.textContent = text || "";
  el.className = "message " + (ok ? "ok" : "bad");
}

async function testApi(){
  setMessage("Testing...");
  try{
    const r = await fetch(
      SUPABASE_URL + "/rest/v1/reservations?select=id&limit=1",
      {headers: apiHeaders(false)}
    );
    const text = await r.text();
    if(!r.ok) throw new Error(text || ("HTTP " + r.status));
    setMessage("Database connection is online ✓", true);
  }catch(e){
    setMessage("Connection failed: " + (e.message || "unknown error"));
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    setMessage("Enter your admin email and password.");
    return;
  }

  const btn = document.getElementById("signBtn");
  btn.disabled = true;
  btn.textContent = "Signing In...";
  setMessage("Checking...");

  try{
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers: apiHeaders(false),
      body: JSON.stringify({email, password})
    });

    const data = await r.json().catch(()=>({}));

    if(!r.ok || !data.access_token){
      throw new Error(data.error_description || data.msg || data.message || ("HTTP " + r.status));
    }

    accessToken = data.access_token;
    sessionStorage.setItem("laPastaAccessToken", accessToken);

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("logoutBtn").style.display = "inline-block";

    await load();
  }catch(e){
    accessToken = "";
    sessionStorage.removeItem("laPastaAccessToken");
    setMessage("Login failed: " + (e.message || "check your Supabase Auth account."));
  }finally{
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
}

async function load(){
  if(!accessToken) return;

  setAppMessage("Loading...");
  try{
    const r = await fetch(
      SUPABASE_URL + "/rest/v1/reservations?select=*&order=created_at.desc",
      {headers: apiHeaders(true)}
    );

    const text = await r.text();
    if(!r.ok){
      if(r.status===401) logout();
      throw new Error(text || ("HTTP " + r.status));
    }

    const d = JSON.parse(text);

    document.getElementById("total").textContent = d.length;

    const now = new Date();
    const localToday = new Intl.DateTimeFormat("en-CA", {
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      year:"numeric", month:"2-digit", day:"2-digit"
    }).format(now);

    document.getElementById("today").textContent =
      d.filter(x => x.date === localToday).length;

    document.getElementById("g").textContent =
      d.reduce((s,x) => s + (parseInt(x.guests)||0), 0);

    document.getElementById("rows").innerHTML = d.map(x => `
      <tr>
        <td>${e(x.name)}</td>
        <td>${e(x.phone)}</td>
        <td>${e(x.date)}</td>
        <td>${e(x.time)}</td>
        <td>${e(x.guests)}</td>
        <td>${e(x.created_at)}</td>
        <td><button class="danger" onclick="del('${e(x.id)}')">Delete</button></td>
      </tr>
    `).join("");

    document.getElementById("empty").style.display = d.length ? "none" : "block";
    setAppMessage(d.length ? "Reservations loaded ✓" : "No reservations yet.", true);
  }catch(e){
    setAppMessage("Could not load reservations: " + (e.message || "unknown error"));
  }
}

async function del(id){
  if(!confirm("Delete this reservation?")) return;

  try{
    const r = await fetch(
      SUPABASE_URL + "/rest/v1/reservations?id=eq." + encodeURIComponent(id),
      {method:"DELETE", headers:apiHeaders(true)}
    );

    const text = await r.text();
    if(!r.ok) throw new Error(text || ("HTTP " + r.status));

    await load();
  }catch(e){
    setAppMessage("Could not delete reservation: " + (e.message || "unknown error"));
  }
}

function logout(){
  accessToken = "";
  sessionStorage.removeItem("laPastaAccessToken");
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("logoutBtn").style.display = "none";
  setMessage("Signed out.", true);
}

function e(x){
  return String(x ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

async function restore(){
  if(!accessToken) return;

  try{
    const r = await fetch(SUPABASE_URL + "/auth/v1/user", {
      headers: apiHeaders(true)
    });
    if(!r.ok) throw new Error();

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("logoutBtn").style.display = "inline-block";
    await load();
  }catch(e){
    logout();
  }
}

restore();
</script>
</body>
</html>
