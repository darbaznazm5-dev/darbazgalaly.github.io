<!doctype html>
<html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechZone | تەواوکردنی کڕین</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="toast"></div><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="logo">TZ</span><span>Tech<span>Zone</span><small>Smart Tech • Better Life</small></span></a></div></header>
<main class="container section"><div class="page-title"><span class="eyebrow">Checkout</span><h1>تەواوکردنی کڕین</h1></div><div class="checkout-grid"><form id="checkoutForm" class="panel"><h2>زانیاری گەیاندن</h2><label>ناو <input required name="name"></label><label>ژمارەی مۆبایل <input required name="phone"></label><label>شار <input required name="city" value="هەولێر"></label><label>ناونیشان <textarea required name="address" rows="3"></textarea></label><label>شێوازی پارەدان<select name="payment"><option value="cod">پارەدان لە کاتی وەرگرتن</option><option value="card">کارت</option><option value="wallet">ئێ-وۆڵێت</option></select></label><button class="btn primary wide" type="submit">ناردنی داواکاری</button></form><aside id="checkoutSummary" class="panel"></aside></div></main><script type="module" src="app.js"></script></body></html>
