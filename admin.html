<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Pasta Admin</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font-family:Montserrat}.wrap{width:min(1100px,94%);margin:auto}.top{padding:35px 0;display:flex;justify-content:space-between;align-items:center}.k{color:#d9a85b;font-size:10px;letter-spacing:.3em}.title{font:600 55px "Cormorant Garamond";color:#efc477;margin:5px 0}.btn{border:1px solid #d9a85b;background:#4d101c;color:#ffe8bd;padding:11px 18px;cursor:pointer}.login,.panel{background:#151515;border:1px solid #34261f;padding:25px}.login{max-width:430px;margin:90px auto}.login h2,.panel h2{font:500 42px "Cormorant Garamond";color:#efc477;margin:4px 0 20px}label{font-size:10px;color:#bbb;display:block;margin:12px 0 5px}input{width:100%;padding:12px;background:#0e0e0e;border:1px solid #654737;color:#fff}.login .btn{width:100%;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#151515;border:1px solid #34261f;padding:18px}.stat b{display:block;font:600 34px "Cormorant Garamond";color:#efc477}.stat span{font-size:10px;color:#999}.table{overflow:auto}.panel table{width:100%;border-collapse:collapse;min-width:780px}.panel th,.panel td{padding:12px;border-bottom:1px solid #2a2521;text-align:left;font-size:10px}.panel th{color:#d9a85b}.danger{background:#351019;color:#efb6bf;border:1px solid #713040;padding:7px;cursor:pointer}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="k">LA PASTA · PRIVATE ADMIN</div><div class="title">Reservations</div></div><a class="btn" href="index.html">← Website</a></div>
<div id="login" class="login"><div class="k">SECURE LOGIN</div><h2>Admin Access</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" onclick="login()">Sign In</button><button class="btn" style="background:#151515;margin-top:8px" onclick="testApi()">Test Connection</button><p id="err" style="color:#d88;font-size:11px"></p></div>
<div id="app" style="display:none"><div class="stats"><div class="stat"><b id="total">0</b><span>Total Reservations</span></div><div class="stat"><b id="today">0</b><span>Today</span></div><div class="stat"><b id="g">0</b><span>Total Guests</span></div></div><div class="panel"><h2>Booking List</h2><div class="table"><table><thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Created</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" style="color:#777;font-size:11px">No reservations.</p></div></div>
</div><script>const API_URL="https://script.google.com/macros/s/AKfycbxcXwEeFcPC9Sa05zvZTwrXSNeNIdDM1M6FjkIOdEH4l2juS0st_auJvkCzqM9igzW5EQ/exec";
let token="";
function apiGet(params){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const q=new URLSearchParams({...params,callback:cb});
    window[cb]=(data)=>{cleanup();resolve(data)};
    s.onerror=()=>{cleanup();reject(new Error("API unavailable"))};
    s.src=API_URL+"?"+q.toString();
    document.body.appendChild(s);
    function cleanup(){delete window[cb];s.remove()}
    setTimeout(()=>{cleanup();reject(new Error("API timeout"))},15000);
  });
}
async function testApi(){err.textContent="Testing...";try{const j=await apiGet({action:"ping"});err.textContent=j.success?"API is online ✓":(j.message||"API error")}catch(e){err.textContent="API unavailable. Check Apps Script deployment."}}
async function login(){
  err.textContent="Checking...";
  try{
    const j=await apiGet({action:"login",email:email.value,password:password.value});
    if(!j.success) throw Error(j.message||"Login failed");
    token=j.token; sessionStorage.token=token; show(); await load();
  }catch(e){err.textContent="Login failed. Check email/password or API deployment."}
}
function show(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block"}
async function load(){
  try{
    const j=await apiGet({action:"list",token});
    if(!j.success) throw Error(j.message||"Unauthorized");
    const d=j.data||[];
    total.textContent=d.length;
    const td=new Date().toISOString().slice(0,10);
    today.textContent=d.filter(x=>x.date===td).length;
    g.textContent=d.reduce((s,x)=>s+(parseInt(x.guests)||0),0);
    rows.innerHTML=d.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.phone)}</td><td>${e(x.date)}</td><td>${e(x.time)}</td><td>${e(x.guests)}</td><td>${e(x.created)}</td><td><button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join("");
    empty.style.display=d.length?"none":"block";
  }catch(e){err.textContent="Could not load reservations.";}
}
async function del(id){if(!confirm("Delete this reservation?"))return; await apiGet({action:"delete",token,id}); load()}
function e(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
if(sessionStorage.token){token=sessionStorage.token;show();load()}
</script></body></html>
