<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TechZone Admin</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#070a12}.field{width:100%;background:#0b1020;border:1px solid #1e293b;border-radius:12px;padding:12px;color:white;outline:none}.field:focus{border-color:#22d3ee}.glass{background:rgba(15,23,42,.75);backdrop-filter:blur(16px)}.grad{background:linear-gradient(90deg,#22d3ee,#8b5cf6);-webkit-background-clip:text;color:transparent}.modal{animation:in .2s}@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}</style></head>
<body class="text-slate-100 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl"><div class="text-center"><div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center text-xl"><i class="fa-solid fa-microchip"></i></div><h1 class="text-3xl font-black mt-5">TechZone <span class="grad">Admin</span></h1><p class="text-slate-500 text-sm mt-2">Private store management</p></div><form onsubmit="loginUser(event)" class="space-y-4 mt-7"><input id="loginEmail" class="field" type="email" required placeholder="Admin email"><input id="loginPass" class="field" type="password" required placeholder="Password"><button class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-violet-600 text-slate-950 font-black">Sign in</button></form><p class="text-[11px] text-slate-600 mt-5 text-center">Demo credentials are shown in the README. Change them before production.</p></div></div>

<div id="app" class="hidden"><header class="sticky top-0 z-30 glass border-b border-slate-800"><div class="h-16 max-w-[1500px] mx-auto px-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center"><i class="fa-solid fa-microchip"></i></div><b class="text-lg">TechZone <span class="grad">Admin</span></b></div><div class="flex items-center gap-3"><span id="who" class="hidden sm:block text-xs text-slate-500"></span><button onclick="logout()" class="px-3 py-2 rounded-lg bg-white/5 text-xs">Logout</button></div></div></header>
<div class="max-w-[1500px] mx-auto p-4 lg:p-6 grid lg:grid-cols-[230px_1fr] gap-6"><aside class="lg:sticky lg:top-24 lg:h-fit bg-slate-900/60 border border-slate-800 rounded-2xl p-3"><button onclick="tab('dashboard')" class="nav w-full text-left px-4 py-3 rounded-xl text-sm"><i class="fa-solid fa-chart-pie w-6"></i>Dashboard</button><button onclick="tab('products')" class="nav w-full text-left px-4 py-3 rounded-xl text-sm text-slate-400"><i class="fa-solid fa-box w-6"></i>Products</button><button onclick="tab('orders')" class="nav w-full text-left px-4 py-3 rounded-xl text-sm text-slate-400"><i class="fa-solid fa-receipt w-6"></i>Orders</button><button onclick="tab('settings')" class="nav w-full text-left px-4 py-3 rounded-xl text-sm text-slate-400"><i class="fa-solid fa-gear w-6"></i>Settings</button></aside>
<main id="main"></main></div></div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm p-4 overflow-auto"><div class="min-h-full flex items-center justify-center"><div class="modal w-full max-w-xl bg-slate-900 border border-slate-800 rounded-3xl p-6"><div class="flex justify-between"><h2 id="mtitle" class="text-xl font-black"></h2><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><form onsubmit="saveProduct(event)" class="space-y-3 mt-5"><input type="hidden" id="pid"><input id="pn" class="field" required placeholder="Product name"><div class="grid grid-cols-2 gap-3"><select id="pc" class="field"><option>Smartphones</option><option>Laptops</option><option>Audio</option><option>Accessories</option></select><input id="ps" class="field" type="number" min="0" required placeholder="Stock"></div><div class="grid grid-cols-2 gap-3"><input id="pp" class="field" type="number" min="0" step=".01" required placeholder="Price"><input id="po" class="field" type="number" min="0" step=".01" placeholder="Old price"></div><textarea id="pd" class="field" rows="3" placeholder="Description"></textarea><button class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-violet-600 text-slate-950 font-black">Save product</button></form></div></div></div>
<script>
const seed=[{id:1,n:"iPhone 15 Pro Max",c:"Smartphones",p:1199,s:14,i:"fa-mobile-screen-button",d:"256GB • Titanium • A17 Pro"},{id:2,n:"MacBook Pro M3 Max",c:"Laptops",p:2499,s:8,i:"fa-laptop",d:"16-inch • 36GB • Liquid Retina XDR"},{id:3,n:"Sony WH-1000XM5",c:"Audio",p:399,s:21,i:"fa-headphones",d:"Noise cancelling • 30-hour battery"},{id:4,n:"Galaxy S24 Ultra",c:"Smartphones",p:1299,s:11,i:"fa-mobile-screen",d:"Flagship camera • S Pen"},{id:5,n:"Dell XPS 15",c:"Laptops",p:1799,s:6,i:"fa-laptop",d:"High-performance • InfinityEdge display"},{id:6,n:"AirPods Pro 2",c:"Audio",p:249,s:32,i:"fa-ear-listen",d:"ANC • Adaptive audio • USB-C"},{id:7,n:"Anker 737 Power Bank",c:"Accessories",p:109,s:25,i:"fa-battery-full",d:"High capacity • Smart display"},{id:8,n:"Apple Watch Series 9",c:"Accessories",p:399,s:17,i:"fa-clock",d:"Health • Fitness • Smart features"}];
const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},save=()=>{localStorage.setItem("tz_products",JSON.stringify(products));localStorage.setItem("tz_orders",JSON.stringify(orders))},money=x=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(x);
let products=get("tz_products",seed),orders=get("tz_orders",[]),current="dashboard";
const ADMIN_EMAIL="owner@techzone.local",ADMIN_PASSWORD="ChangeMe!2026";
function loginUser(e){e.preventDefault();if(loginEmail.value===ADMIN_EMAIL&&loginPass.value===ADMIN_PASSWORD){sessionStorage.setItem("tz_admin","1");showApp()}else alert("Invalid admin credentials.")}
function showApp(){login.classList.add("hidden");app.classList.remove("hidden");who.textContent=ADMIN_EMAIL;tab("dashboard")}
function logout(){sessionStorage.removeItem("tz_admin");location.reload()}
function tab(t){current=t;document.querySelectorAll(".nav").forEach(x=>x.classList.add("text-slate-400"));main.innerHTML=t==="dashboard"?dashboard():t==="products"?productsPage():t==="orders"?ordersPage():settingsPage()}
function dashboard(){let revenue=orders.reduce((a,o)=>a+o.total,0),stock=products.reduce((a,p)=>a+p.s,0);return `<div><div class="flex justify-between items-end mb-6"><div><p class="text-cyan-300 text-xs font-bold uppercase tracking-widest">Overview</p><h1 class="text-3xl font-black mt-1">Good to see you, owner.</h1></div><span class="text-xs text-emerald-400"><i class="fa-solid fa-circle text-[7px] mr-1"></i>Store operational</span></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${[["Revenue",money(revenue),"fa-dollar-sign"],["Orders",orders.length,"fa-receipt"],["Products",products.length,"fa-box"],["Stock units",stock,"fa-warehouse"]].map(x=>`<div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><i class="fa-solid ${x[2]} text-cyan-300"></i><p class="text-sm text-slate-500 mt-5">${x[0]}</p><b class="text-2xl block mt-1">${x[1]}</b></div>`).join("")}</div><div class="mt-6 bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><h2 class="font-black">Latest orders</h2>${orders.slice(0,5).map(o=>`<div class="py-4 border-b border-slate-800 last:border-0 flex flex-wrap gap-3 justify-between text-sm"><span class="font-mono text-cyan-300">${o.id}</span><span>${o.customer.name}</span><span>${money(o.total)}</span><span class="text-slate-500">${o.status}</span></div>`).join("")||'<p class="text-slate-600 py-8">No orders yet.</p>'}</div></div>`}
function productsPage(){return `<div><div class="flex justify-between items-end mb-6"><div><p class="text-cyan-300 text-xs font-bold uppercase tracking-widest">Catalog</p><h1 class="text-3xl font-black mt-1">Products</h1></div><button onclick="openModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-violet-600 text-slate-950 font-black text-sm"><i class="fa-solid fa-plus mr-1"></i>Add product</button></div><div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-auto"><table class="w-full text-left text-sm"><thead class="text-xs text-slate-500 uppercase bg-slate-950/50"><tr><th class="p-4">Product</th><th class="p-4">Category</th><th class="p-4">Price</th><th class="p-4">Stock</th><th class="p-4">Actions</th></tr></thead><tbody>${products.map(p=>`<tr class="border-t border-slate-800"><td class="p-4 font-bold">${p.n}</td><td class="p-4 text-slate-500">${p.c}</td><td class="p-4">${money(p.p)}</td><td class="p-4 ${p.s<5?"text-rose-400":"text-emerald-400"}">${p.s}</td><td class="p-4"><button onclick="edit(${p.id})" class="text-cyan-300 mr-4">Edit</button><button onclick="remove(${p.id})" class="text-rose-400">Delete</button></td></tr>`).join("")}</tbody></table></div></div>`}
function ordersPage(){return `<div><p class="text-cyan-300 text-xs font-bold uppercase tracking-widest">Sales</p><h1 class="text-3xl font-black mt-1 mb-6">Orders</h1><div class="space-y-3">${orders.map(o=>`<div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3"><b class="font-mono text-cyan-300">${o.id}</b><b>${money(o.total)}</b><select onchange="setStatus('${o.id}',this.value)" class="field !w-auto !py-1 !px-2 text-xs">${["Pending","Processing","Shipped","Completed","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div><p class="text-sm mt-3">${o.customer.name} · ${o.customer.phone} · ${o.customer.email}</p><p class="text-xs text-slate-500 mt-1">${o.customer.address}</p><div class="text-xs text-slate-500 mt-3">${o.items.map(i=>`${i.name} × ${i.q}`).join(" • ")}</div></div>`).join("")||'<div class="text-center py-16 text-slate-600">No orders yet.</div>'}</div>`}
function settingsPage(){return `<div><p class="text-cyan-300 text-xs font-bold uppercase tracking-widest">Owner controls</p><h1 class="text-3xl font-black mt-1">Settings</h1><div class="mt-6 max-w-2xl bg-slate-900/60 border border-slate-800 rounded-2xl p-6"><h2 class="font-black">Admin account</h2><p class="text-sm text-slate-500 mt-2">The demo account is stored in this file. For a real deployment, move authentication to a server/database so the password is never exposed in browser code.</p><div class="grid sm:grid-cols-2 gap-3 mt-5"><input class="field" value="${ADMIN_EMAIL}" readonly><input class="field" value="••••••••••••" readonly></div></div></div>`}
function openModal(p=null){modal.classList.remove("hidden");mtitle.textContent=p?"Edit product":"Add product";pid.value=p?.id||"";pn.value=p?.n||"";pc.value=p?.c||"Smartphones";ps.value=p?.s??"";pp.value=p?.p??"";po.value=p?.o??"";pd.value=p?.d||""}
function closeModal(){modal.classList.add("hidden")}function edit(id){openModal(products.find(p=>p.id===id))}
function saveProduct(e){e.preventDefault();let id=+pid.value,d={n:pn.value,c:pc.value,s:+ps.value,p:+pp.value,o:+po.value||0,d:pd.value,i:({"Smartphones":"fa-mobile-screen-button","Laptops":"fa-laptop","Audio":"fa-headphones","Accessories":"fa-plug"})[pc.value]};if(id)Object.assign(products.find(p=>p.id===id),d);else products.push({id:Date.now(),...d});save();closeModal();tab("products")}
function remove(id){if(confirm("Delete this product?")){products=products.filter(p=>p.id!==id);save();tab("products")}}
function setStatus(id,s){let o=orders.find(x=>x.id===id);if(o)o.status=s;save()}
if(sessionStorage.getItem("tz_admin")==="1")showApp();
</script></body></html>
